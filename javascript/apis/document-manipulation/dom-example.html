<!doctype html>
<html lang="en-US">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple DOM example</title>
  <style>
    .highlight {
      color: white;
      background-color: black;
      padding: 10px;
      width: 250px;
      text-align: center;
    }
  </style>
</head>

<body>
  <section>
    <img src="dinosaur.png"
      alt="A red Tyrannosaurus Rex: A two legged dinosaur standing upright like a human, with small arms, and a large head with lots of sharp teeth." />
    <p>
      Here we will add a link to the
      <a href="https://www.mozilla.org/">Mozilla homepage</a>
    </p>
  </section>
  <script>
    const link = document.querySelector("a");
    link.textContent = "Mozilla Developer Network";
    link.href = "https://developer.mozilla.org";

    const sect = document.querySelector("section");
    const para = document.createElement("p");
    para.textContent = "We hope you enjoyed the ride.";

    // append it to the section:
    sect.appendChild(para);

    // creating a text node
    const text = document.createTextNode("- The premier source of web development knowledge.");

    // we now link it to the para
    const linkPara = document.querySelector("p");
    linkPara.appendChild(text);

    // this moves the para to the bottom;
    sect.appendChild(linkPara);

    // remove the element
    // linkPara.remove();

    // // changing the style
    // para.style.color = "pink";
    // para.style.padding = "18px";
    // para.style.width = "250px";
    // para.style.textAlign = "center";
    para.classList.add("highlight");


  </script>
</body>

</html>
